# プレフィックスキーをCtrl+sに変更
unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on

# ペインのボーダー色（見やすく）
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour201

# ペイン分割のショートカット（分割後に均等化）
bind | split-window -h \; select-layout even-horizontal
bind - split-window -v \; select-layout even-vertical

# 手動でペインを均等化（Prefix + =）→ 縦に均等配置
bind = select-layout even-horizontal

# vim風ペイン移動（hjkl）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# プレフィックス押下時のビジュアル表示
set -g status-style "bg=colour235,fg=colour255"
set -g status-left "#{?client_prefix,#[bg=colour201]#[fg=colour255] PREFIX ,#[bg=colour240]#[fg=colour255] TMUX }"
set -g status-left-length 20
